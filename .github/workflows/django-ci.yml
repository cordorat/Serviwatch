---
    name: Django CI
    on:
      push:
        branches:
          - development
      pull_request:
        branches:
          - development
    jobs:
      build:
        runs-on: ubuntu-latest
        strategy:
          matrix:
            python-version:
              - 3.13
        steps:
          - uses: actions/checkout@v3
            with:
              fetch-depth: 0

          - name: Set up Python ${{ matrix.python-version }}
            uses: actions/setup-python@v4
            with:
              python-version: ${{ matrix.python-version }}
          - name: Clear pip cache
            run: |
                pip cache purge
          - name: Install Dependencies
            run: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
          - name: Run Migrations
            run: |
              python manage.py makemigrations
              python manage.py migrate
          - name: Run Tests and Generate Coverage
            run: |
              coverage run manage.py test
              coverage xml
          
          - name: SonarQube Scan
            if: github.event.pull_request.base.ref == 'development' || github.event_name == 'push'
            uses: SonarSource/sonarqube-scan-action@v5
            env:
              SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            with:
              args: >
                -Dsonar.projectKey=cordorat_Serviwatch
                -Dsonar.python.coverage.reportPaths=coverage.xml
                -Dsonar.sources=.
                -Dsonar.exclusions=**/migrations/**,venv/**,**/tests/**,**/js/**,**/static/js/**,**/node_modules/**,**/admin.py,**/apps.py,**/asgi.py,**/manage.py,**/settings.py,**/urls.py,**/wsgi.py
                -Dsonar.cpd.exclusions=**/*.html,**/services/ingreso_service.py,**/services/egreso_service.py,**/forms/ingreso_form.py,**/forms/egreso_form.py,**/forms/ganancia_form.py,**/services/empleado_service.py,**/services/reloj_service.py 
                -Dsonar.host.url=https://sonarcloud.io
                -Dsonar.organization=desprogramadores
                -Dsonar.branch.name=development
                
