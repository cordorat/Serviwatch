{% extends 'base.html' %}
{% load static %}

{% block title %}Servicios de Relojería{% endblock %}

{% block content %}
<div class="productos-container mt-5">
    <h2 class="titulo-ventana text-center mb-4">PRODUCTOS</h2>
    <div class="row justify-content-center mt-5">
        <div class="col-12 d-flex flex-wrap gap-4 justify-content-center">

            <a href="{% url 'reparacion_list_admin' %}" class="text-decoration-none text-dark">
                <div class="service-card text-center">
                    <div class="service-icon mx-auto mb-2">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path
                                d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
                                stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                    <div class="service-title">Reparaciones</div>
                </div>
            </a>

            <a href="{% url 'inventario_administrador' %}" class="text-decoration-none text-dark">
                <div class="service-card text-center">
                    <div class="service-icon mx-auto mb-2">
                        <?xml version="1.0" encoding="UTF-8"?>
                        <svg xmlns="http://www.w3.org/2000/svg" id="Layer_1" data-name="Layer 1" viewBox="0 0 24 24">
                            <path
                                d="m3,22h7v2H3c-1.654,0-3-1.346-3-3V2h5.171c.413-1.164,1.525-2,2.829-2h2c1.304,0,2.416.836,2.829,2h5.171v9h-2v-7h-5v-1c0-.551-.449-1-1-1h-2c-.551,0-1,.449-1,1v1H2v17c0,.552.449,1,1,1Zm3.165-13.131l-1.241-1.192-1.386,1.442,1.45,1.393c.326.326.754.488,1.181.488.425,0,.848-.161,1.168-.481l2.759-2.702-1.399-1.429-2.533,2.48Zm0,6l-1.241-1.192-1.386,1.441,1.449,1.393c.315.315.734.489,1.179.489s.865-.174,1.171-.48l2.759-2.702-1.399-1.429-2.533,2.481Zm17.835,1.131v8h-12v-8c0-1.654,1.346-3,3-3h6c1.654,0,3,1.346,3,3Zm-2,0c0-.552-.448-1-1-1h-6c-.552,0-1,.448-1,1v6h8v-6Zm-6,3h4v-2h-4v2Zm-2-10h-2.447l-2.042,2h4.489v-2Z" />
                        </svg>

                    </div>
                    <div class="service-title">INVENTARIO</div>
                </div>
            </a>
        </div>
    </div>
</div>

<style>
    .service-card {
        width: 340px;
        height: 375px;
        background-color: #D4E484;
        border-radius: 30px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 15px;
        transition: all 0.3s ease;
    }

    .service-card:hover {
        transform: translateY(-5px);
        cursor: pointer;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);

    }

    .productos-container {
        max-width: 900px;
        margin: 0 auto !important;
        padding: 20px;
    }

    .content {
        display: flex;
        justify-content: normal;
        align-items: flex-start;
        width: 100%;
        padding: 20px;
    }

    .service-icon {
        width: 200px;
        height: 200px;
    }

    .service-title {
        font-size: 40px;
        font-weight: 600;
        text-transform: uppercase;
        font-family: 'inter', sans-serif;
    }

    @media (max-width: 500px) {
        .service-card {
            width: 120px;
            height: 120px;
        }

        .service-icon {
            width: 40px;
            height: 40px;
        }
    }
</style>

{% endblock %}
