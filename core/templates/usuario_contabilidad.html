    <style>
      .service-card {
        width: 340px;
        height: 375px;
        background-color: #d4e484;
        border-radius: 30px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 15px;
        transition: all 0.3s ease;

      }

      .service-card:hover {
        transform: translateY(-5px);
        cursor: pointer;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);

      }

      .productos-container {
        max-width: 900px;
        margin: 0 auto !important;
        padding: 20px;
      }

      .content {
        display: flex;
        justify-content: normal;
        align-items: flex-start;
        width: 100%;
        padding: 20px;
      }

      .service-icon {
        width: 200px;
        height: 200px;
      }

      .service-title {
        font-size: 40px;
        font-weight: 600;
        text-transform: uppercase;
        font-family: "inter", sans-serif;
      }

      @media (max-width: 500px) {
        .service-card {
          width: 120px;
          height: 120px;
        }

        .service-icon {
          width: 40px;
          height: 40px;
        }
      }
    </style>
